pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Include TACZ as composite build for API access
includeBuild('../../libs and references/TACZ-1.21.1') {
    dependencySubstitution {
        substitute module('com.tacz.guns:tacz') using project(':')
    }
}

// PJM-Ragdooll owns the ragdoll bodies and their bone geometry; we only widen
// our existing hitbox mixins onto its BoneHittable seam.
includeBuild('../PJM-Ragdooll') {
    dependencySubstitution {
        substitute module('ru.liko.pjmragdoll:pjmragdoll') using project(':')
    }
}
