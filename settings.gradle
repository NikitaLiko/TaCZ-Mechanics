pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Include TACZ as composite build for API access
includeBuild('../../libs and references/TACZ-1.21.1') {
    dependencySubstitution {
        substitute module('com.tacz.guns:tacz') using project(':')
    }
}

// PJM-Ragdooll owns the ragdoll bodies and their bone geometry; we only widen
// our existing hitbox mixins onto its BoneHittable seam.
includeBuild('../PJM-Ragdooll') {
    dependencySubstitution {
        substitute module('ru.liko.pjmragdoll:pjmragdoll') using project(':')
    }
}

// PJM-API owns OpenAL low-pass filtering: resolving the source, applying the filter on
// the sound thread and combining several muffle contributions into the one slot a source
// has. Our own copy leaked a filter object per muffled sound and let tinnitus and distant
// fire overwrite each other.
includeBuild('../PJM-API') {
    dependencySubstitution {
        substitute module('ru.liko.pjmapi:pjmapi') using project(':')
    }
}
